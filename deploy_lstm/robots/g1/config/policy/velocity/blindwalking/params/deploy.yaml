actions:
  JointPositionAction:
    clip: null
    joint_names: [.*]
    raw_clip: [-0.6, 0.6]
    raw_filter_alpha: 0.92
    scale: [0.25,0.25,0.25,0.25,0.25,0.25, 0.25,0.25,0.25,0.25,0.25,0.25, 0.25, 0.25,0.25,0.25,0.25, 0.25,0.25,0.25,0.25]
    offset: [-0.25,0,0,0.46,-0.25,0, -0.25,0,0,0.46,-0.25,0, 0, 0.07,0.24,0,1.39, 0.07,-0.24,0,1.39]
    joint_ids: null

observations:
  base_ang_vel:
    params: {}
    clip: null
    scale: null
    history_length: 1
  projected_gravity:
    params: {}
    clip: null
    scale: null
    history_length: 1
  velocity_commands:
    params: {command_name: base_velocity}
    clip: null
    scale: [2.0, 2.0, 2.0]
    history_length: 1
  joint_pos_rel:
    params: {}
    clip: null
    scale: null
    history_length: 1
  joint_vel_rel:
    params: {}
    clip: null
    scale: [0.05,0.05,0.05,0.05,0.05,0.05, 0.05,0.05,0.05,0.05,0.05,0.05, 0.05, 0.05,0.05,0.05,0.05, 0.05,0.05,0.05,0.05]
