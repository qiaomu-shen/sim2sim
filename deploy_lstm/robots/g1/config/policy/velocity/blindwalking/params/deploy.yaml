  last_action:
    params: {}
    clip: null
    scale: null
    history_length: 1
  height_scan:
    params: {size: 121, fill_value: 0.35, bridge_file: "/tmp/unitree_g1_height_scan.bin"}
    clip: [-1.0, 1.0]
    scale: null
    history_length: 1

diagnostics:
  log_interval_steps: 20
  run_directory:
    enabled: true
    root: log
    latest_file: log/latest_run_dir.txt
  touchdown_log:
    enabled: true
    flush_interval_steps: 10
  touchdown_events:
    enabled: false
  foot_event_observer:
    enabled: false
