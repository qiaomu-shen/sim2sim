# Policy/observation/action order follows the IsaacLab 29-DOF articulation
# order with the eight locked joints removed, not SDK order:
# L hip pitch, R hip pitch, waist yaw, L hip roll, R hip roll,
# L hip yaw, R hip yaw, L knee, R knee, L shoulder pitch, R shoulder pitch,
# L ankle pitch, R ankle pitch, L shoulder roll, R shoulder roll,
# L ankle roll, R ankle roll, L shoulder yaw, R shoulder yaw,
# L elbow, R elbow.
joint_ids_map: [0,6,12,1,7,2,8,3,9,15,22,4,10,16,23,5,11,17,24,18,25]
step_dt: 0.02
use_training_step_semantics: true

# Gains stay in Unitree SDK motor order because the stock unitree_rl_lab
# controller applies them directly to motor_cmd()[sdk_id]. These values match
# the IsaacLab ImplicitActuatorCfg used by the 2026-07-09 training run.
stiffness: [
  100,100,100,150,40,40,
  100,100,100,150,40,40,
  100,200,200,
  100,100,50,50,40,20,20,
  100,100,50,50,40,20,20
]
damping: [
  2,2,2,4,2,2,
  2,2,2,4,2,2,
  2,4,4,
  2,2,2,2,1,0.5,0.5,
  2,2,2,2,1,0.5,0.5
]

default_joint_pos: [-0.25,-0.25,0,0,0,0,0,0.46,0.46,0.07,0.07,-0.25,-0.25,0.24,-0.24,0,0,0,0,1.39,1.39]

locked_joints:
  ids: [13,14,19,20,21,26,27,28]
  positions: [0,0,0,0,0,0,0,0]
  stiffness: [200,200,40,20,20,40,20,20]
  damping: [4,4,1,0.5,0.5,1,0.5,0.5]

entry_posture:
  enabled: true
  duration_s: 1.0
  positions: [-0.25,-0.25,0,0,0,0,0,0.46,0.46,0.07,0.07,-0.25,-0.25,0.24,-0.24,0,0,0,0,1.39,1.39]

stand_hold:
  use_on_zero_command: false
  positions: [-0.25,-0.25,0,0,0,0,0,0.46,0.46,0.07,0.07,-0.25,-0.25,0.24,-0.24,0,0,0,0,1.39,1.39]

diagnostics:
  enabled: true
  log_interval_steps: 25
  warmup_steps: 10

commands:
  base_velocity:
    deadzone: 0.05
    zero_command_on_deadzone: true
    hold_default_on_zero_command: false
    keep_last_nonzero_on_zero_command: true
    snap_to_limit_on_input: true
    ranges:
      lin_vel_x: [0.0, 0.6]
      lin_vel_y: [0.0, 0.0]
      ang_vel_z: [0.0, 0.0]
      heading: null

actions:
  JointPositionAction:
    clip: null
    raw_clip: null
    raw_filter_alpha: 0.0
    joint_names: [.*]
    scale: [0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25]
    offset: [-0.25,-0.25,0,0,0,0,0,0.46,0.46,0.07,0.07,-0.25,-0.25,0.24,-0.24,0,0,0,0,1.39,1.39]
    joint_ids: null

observations:
  base_ang_vel:
    params: {}
    clip: null
    scale: null
    history_length: 1
  projected_gravity:
    params: {}
    clip: null
    scale: null
    history_length: 1
  velocity_commands:
    params: {command_name: base_velocity}
    clip: null
    scale: [2.0, 2.0, 2.0]
    history_length: 1
  joint_pos_rel:
    params: {}
    clip: null
    scale: null
    history_length: 1
  joint_vel_rel:
    params: {}
    clip: null
    scale: [0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05,0.05]
    history_length: 1
  last_action:
    params: {}
    clip: null
    scale: null
    history_length: 1
  height_scan:
    params: {size: 121, max_age_s: 0.25, require_bridge: true, allow_missing_during_init: true, bridge_file: "/tmp/unitree_g1_height_scan.bin"}
    clip: [-1.0, 1.0]
    scale: null
    history_length: 1
