robot: "g1"
robot_scene: "scene_sim2sim_stairs_08.xml"

domain_id: 0
interface: "lo"

use_joystick: 1
joystick_type: "xbox"
joystick_device: "/dev/input/js0"
joystick_bits: 16

print_scene_information: 1
enable_elastic_band: 1
elastic_band_auto_align: 1
elastic_band_target_yaw_deg: 0.0
elastic_band_align_kp_upright: 140.0
elastic_band_align_kd_upright: 18.0
elastic_band_align_kp_yaw: 80.0
elastic_band_align_kd_yaw: 12.0
elastic_band_align_torque_limit: 120.0

enable_depth_bridge: 1
depth_bridge_file: "/tmp/unitree_g1_front_depth.bin"
depth_camera_body: "torso_link"
depth_width: 64
depth_height: 36
depth_min: 0.01
depth_cutoff: 3.0
depth_fovy: 55.2
depth_fps: 50.0
depth_pitch_deg: -47.6
depth_pos_x: 0.10
depth_pos_y: 0.0
depth_pos_z: 0.45

enable_height_scan_bridge: 1
height_scan_bridge_file: "/tmp/unitree_g1_lidar_blindwalking_model2600_height_scan.bin"
height_scan_mode: "estimated"   # ideal | estimated
height_scan_body: "pelvis"
height_scan_size_x: 1.0
height_scan_size_y: 1.0
height_scan_resolution: 0.1
height_scan_ray_start_z: 20.0
height_scan_offset: 0.5
height_scan_fps: 50.0
height_scan_sensor_height_includes_ray_start_z: 0
height_scan_value_clip: 2.0
height_scan_local_x_offset: 0.0

# Estimated mode: simulate a head LiDAR blind-zone pipeline.  The policy reads
# the estimated map from height_scan_bridge_file; these debug files mirror it.
height_scan_estimator_visible_x_min: -0.70
height_scan_estimator_visible_x_max: 1.15
height_scan_estimator_visible_y_min: -0.70
height_scan_estimator_visible_y_max: 0.70
height_scan_estimator_blind_x_min: -0.30
height_scan_estimator_blind_x_max: 0.35
height_scan_estimator_blind_y_min: -0.32
height_scan_estimator_blind_y_max: 0.32
height_scan_estimator_sample_resolution: 0.03
height_scan_estimator_memory_resolution: 0.025
height_scan_estimator_memory_max_age: 2.0
height_scan_estimator_memory_max_distance: 2.5
height_scan_estimator_query_radius: 0.065
height_scan_estimator_query_percentile: 90.0
height_scan_estimator_nominal_pelvis_height: 0.793
height_scan_estimator_support_x_min: -0.24
height_scan_estimator_support_x_max: 0.34
height_scan_estimator_support_y_min: -0.28
height_scan_estimator_support_y_max: 0.28
height_scan_estimator_support_percentile: 88.0
height_scan_estimator_base_z_rise_rate: 1.10
height_scan_estimator_base_z_fall_rate: 0.45
height_scan_estimator_fill_value: 0.28
height_scan_estimator_use_last_for_unknown: 1
height_scan_estimator_use_true_xy_yaw: 1
height_scan_debug_write: 1
height_scan_debug_csv_file: "/tmp/unitree_g1_height_scan_estimated.csv"
height_scan_debug_ppm_file: "/tmp/unitree_g1_height_scan_estimated.ppm"

enable_touchdown_truth_log: 1
touchdown_truth_log_file: "/home/ubt2204/work/111/TRY/sim2sim/deploy_lstm/robots/g1/log/touchdown_truth.csv"
touchdown_truth_use_latest_run_dir: 1
touchdown_truth_latest_run_dir_file: "/home/ubt2204/work/111/TRY/sim2sim/deploy_lstm/robots/g1/log/latest_run_dir.txt"
touchdown_truth_timestamp_run_dir: 1
touchdown_truth_flush_interval_events: 10
touchdown_truth_state_interval_ms: 20
touchdown_truth_min_air_ms: 50
touchdown_truth_cooldown_ms: 120
